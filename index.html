<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zest</title>
<style>
:root{--o:#ff6a1a;--bg:#fff;--ink:#2a1a10;--mut:#8a6f5e;--soft:#fff3ea;--line:#f4dccb}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr 84px;grid-template-areas:"nav main" "bar bar"}
nav{grid-area:nav;background:var(--soft);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.logo{font-size:24px;font-weight:800;color:var(--o);margin:0 10px 18px;letter-spacing:-.5px}
nav button{all:unset;cursor:pointer;padding:11px 14px;border-radius:10px;font-weight:600;color:var(--mut)}
nav button:hover{background:#fff}
nav button.on{background:var(--o);color:#fff}
main{grid-area:main;overflow:auto;padding:28px 32px}
h1{margin:0 0 18px;font-size:30px;letter-spacing:-.5px}
h2{margin:26px 0 12px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{cursor:pointer;padding:10px;border-radius:14px;border:1px solid var(--line)}
.card:hover{background:var(--soft)}
.card .cv{aspect-ratio:1;border-radius:10px;margin-bottom:8px}
.cv{background:linear-gradient(135deg,hsl(var(--h) 100% 55%),hsl(calc(var(--h) + 16) 100% 72%));width:44px;height:44px;border-radius:8px;flex:none}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;cursor:pointer}
.row:hover,.row.now{background:var(--soft)}
.row.now b{color:var(--o)}
.mt{flex:1;min-width:0;display:flex;flex-direction:column}
.mt b,.mt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small{color:var(--mut)}
.ic{all:unset;cursor:pointer;color:var(--o);font-size:18px;padding:4px 8px}
.btn{all:unset;cursor:pointer;background:var(--o);color:#fff;padding:9px 18px;border-radius:99px;font-weight:700}
.btn.ghost{background:none;color:var(--o);border:1.5px solid var(--o)}
input[type=text],input[type=file]{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin-bottom:10px}
input[type=text]:focus{outline:2px solid var(--o);border-color:var(--o)}
.box{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;max-width:560px}
.pick{max-height:150px;overflow:auto;margin-bottom:10px}
.pick label{display:block;padding:4px 0}
.tag{background:var(--o);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px;margin-left:6px}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;margin-right:8px;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.empty{color:var(--mut);padding:14px 0}
#bar{grid-area:bar;border-top:1px solid var(--line);background:#fff;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:14px;padding:0 20px}
#np{display:flex;align-items:center;gap:12px;min-width:0}
#ctl{display:flex;flex-direction:column;align-items:center;gap:2px}
#ctl div{display:flex;align-items:center;gap:10px}
#pp{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;background:var(--o);color:#fff;text-align:center;line-height:40px;font-size:16px}
#sk{display:flex;align-items:center;gap:8px;width:100%;font-size:12px;color:var(--mut)}
input[type=range]{accent-color:var(--o);flex:1;min-width:0}
#vol{display:flex;justify-content:flex-end}
#vol input{max-width:110px}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
@media(max-width:720px){
body{grid-template-columns:1fr;grid-template-rows:1fr 76px 58px;grid-template-areas:"main" "bar" "nav"}
nav{flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);justify-content:space-around}
.logo{display:none}
nav button{padding:8px 10px;font-size:13px}
main{padding:18px}
#bar{grid-template-columns:1fr auto;padding:0 12px}
#sk,#vol{display:none}
}
</style>
</head>
<body>
<nav id="nav">
  <div class="logo">Zest</div>
  <button data-v="home">Home</button>
  <button data-v="search">Search</button>
  <button data-v="library">Library</button>
  <button data-v="create">Create</button>
  <button data-v="settings">Settings</button>
</nav>
<main id="main"></main>
<div id="bar">
  <div id="np"><div class="cv" id="npc" style="--h:20"></div><div class="mt"><b id="npt">Nothing playing</b><small id="npa">Pick a song</small></div></div>
  <div id="ctl">
    <div><button class="ic" id="pv" aria-label="Previous">⏮</button><button id="pp" aria-label="Play or pause">▶</button><button class="ic" id="nx" aria-label="Next">⏭</button></div>
    <div id="sk"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
  </div>
  <div id="vol"><input type="range" id="vl" min="0" max="1" step=".01" value=".8" aria-label="Volume"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

// Starter songs: free demo tracks from SoundHelix. Swap in your own audio URLs here.
const U='https://www.soundhelix.com/examples/mp3/SoundHelix-Song-';
const names=['Golden Hour','Citrus Drive','Amber Static','Peach Fuzz','Sunday Marmalade','Ember Lines','Paper Lanterns','Late Tangerine'];
const tracks=names.map((t,i)=>({id:'s'+i,title:t,artist:'SoundHelix',src:U+(i+1)+'.mp3'}));

let lib=load('lib',{playlists:[],albums:[],liked:[]});
let cfg=load('cfg',{name:'',accent:'#ff6a1a',auto:true});
let S={view:'home',vis:[],queue:[],i:-1};
const au=new Audio();au.volume=.8;
const tk=id=>tracks.find(t=>t.id===id);
const hue=t=>(tracks.indexOf(t)*13)%34+8;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const cur=()=>S.queue[S.i];

function applyAccent(){document.documentElement.style.setProperty('--o',cfg.accent)}

function row(t){
  const liked=lib.liked.includes(t.id);
  return `<div class="row ${cur()===t.id?'now':''}" data-act="play" data-id="${t.id}"><div class="cv" style="--h:${hue(t)}"></div><div class="mt"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div><button class="ic" data-act="like" data-id="${t.id}" aria-label="Like">${liked?'♥':'♡'}</button></div>`;
}
function list(ids){S.vis=ids;return ids.length?ids.map(i=>tk(i)).filter(Boolean).map(row).join(''):'<div class="empty">Nothing here yet.</div>'}
function collection(c,kind){
  const ids=c.ids.filter(tk);
  return `<div class="card" data-act="playlist" data-kind="${kind}" data-id="${c.id}"><div class="cv" style="--h:${ids[0]?hue(tk(ids[0])):20}"></div><b>${esc(c.name)}</b>${c.pub?'<span class="tag">Public</span>':''}<br><small>${ids.length} songs</small><br><button class="ic" data-act="del" data-kind="${kind}" data-id="${c.id}">Delete</button></div>`;
}
const picker=()=>`<div class="pick">${tracks.map(t=>`<label><input type="checkbox" name="t" value="${t.id}"> ${esc(t.title)} <small>${esc(t.artist)}</small></label>`).join('')}</div>`;

const views={
  home(){
    const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
    const first=tracks.slice(0,4).map(t=>`<div class="card" data-act="play" data-id="${t.id}"><div class="cv" style="--h:${hue(t)}"></div><b>${esc(t.title)}</b><br><small>${esc(t.artist)}</small></div>`).join('');
    S.vis=tracks.map(t=>t.id);
    return `<h1>${g}${cfg.name?', '+esc(cfg.name):''}</h1><div class="grid">${first}</div><h2>All songs</h2>${list(tracks.map(t=>t.id))}`;
  },
  search(){return `<h1>Search</h1><input type="text" id="q" placeholder="Songs or artists" aria-label="Search" autofocus><div id="res">${list(tracks.map(t=>t.id))}</div>`},
  library(){
    const pl=lib.playlists.map(p=>collection(p,'playlists')).join('')||'<div class="empty">No playlists yet. Make one in Create.</div>';
    const al=lib.albums.map(a=>collection(a,'albums')).join('')||'<div class="empty">No albums yet. Make one in Create.</div>';
    return `<h1>Your library</h1><h2>Liked songs</h2>${list(lib.liked)}<h2>Playlists</h2><div class="grid">${pl}</div><h2>Albums</h2><div class="grid">${al}</div>`;
  },
  create(){return `<h1>Create</h1>
    <form class="box" data-form="song"><b>Add your own song</b><br><small>Songs you add last until you close the tab.</small><br><br>
      <input type="file" name="f" accept="audio/*" required><input type="text" name="title" placeholder="Song title" required><input type="text" name="artist" placeholder="Artist name" value="${esc(cfg.name)}">
      <button class="btn">Add song</button></form>
    <form class="box" data-form="playlist"><b>New playlist</b><br><br><input type="text" name="name" placeholder="Playlist name" required>${picker()}
      <label><input type="checkbox" name="pub"> Make it public</label><br><br><button class="btn">Save playlist</button></form>
    <form class="box" data-form="album"><b>New album</b><br><br><input type="text" name="name" placeholder="Album name" required>${picker()}<button class="btn">Save album</button></form>`},
  settings(){
    const cols=['#ff6a1a','#ff8a00','#f2541b','#e8590c','#ffb000'];
    return `<h1>Settings</h1>
    <div class="box"><b>Your name</b><br><br><input type="text" id="nm" value="${esc(cfg.name)}" placeholder="What should we call you?"></div>
    <div class="box"><b>Accent colour</b><br><br>${cols.map(c=>`<span class="sw ${c===cfg.accent?'on':''}" style="background:${c}" data-act="accent" data-c="${c}" role="button" aria-label="Accent ${c}"></span>`).join('')}</div>
    <div class="box"><label><input type="checkbox" id="auto" ${cfg.auto?'checked':''}> Play the next song automatically</label></div>
    <div class="box"><button class="btn ghost" data-act="reset">Clear my library and settings</button></div>`;
  }
};

function render(){
  $('#main').innerHTML=views[S.view]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
}
function playIds(ids,i){S.queue=ids.filter(tk);S.i=i;start()}
function start(){const t=tk(cur());if(!t)return;au.src=t.src;au.play().catch(()=>{});bar();render()}
function bar(){
  const t=tk(cur());
  $('#npt').textContent=t?t.title:'Nothing playing';$('#npa').textContent=t?t.artist:'Pick a song';
  $('#npc').style.setProperty('--h',t?hue(t):20);$('#pp').textContent=au.paused?'▶':'⏸';
}
function step(d){if(!S.queue.length)return;S.i=(S.i+d+S.queue.length)%S.queue.length;start()}

document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button');if(nb){S.view=nb.dataset.v;render();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='like'){e.stopPropagation();const l=lib.liked,k=l.indexOf(id);k<0?l.push(id):l.splice(k,1);save('lib',lib);render()}
  else if(a==='play'){const k=S.vis.indexOf(id);playIds(S.vis,k)}
  else if(a==='playlist'){const c=lib[el.dataset.kind].find(x=>x.id===id);if(c&&c.ids.some(tk))playIds(c.ids,0)}
  else if(a==='del'){e.stopPropagation();lib[el.dataset.kind]=lib[el.dataset.kind].filter(x=>x.id!==id);save('lib',lib);render()}
  else if(a==='accent'){cfg.accent=el.dataset.c;save('cfg',cfg);applyAccent();render()}
  else if(a==='reset'){if(confirm('Clear everything you saved?')){lib={playlists:[],albums:[],liked:[]};cfg={name:'',accent:'#ff6a1a',auto:true};save('lib',lib);save('cfg',cfg);applyAccent();render()}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){const q=e.target.value.toLowerCase();$('#res').innerHTML=list(tracks.filter(t=>(t.title+t.artist).toLowerCase().includes(q)).map(t=>t.id))}
  if(e.target.id==='nm'){cfg.name=e.target.value;save('cfg',cfg)}
});
document.addEventListener('change',e=>{if(e.target.id==='auto'){cfg.auto=e.target.checked;save('cfg',cfg)}});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,d=new FormData(f),k=f.dataset.form;
  const ids=d.getAll('t');
  if(k==='song'){const file=d.get('f');if(!file||!file.size)return;
    tracks.push({id:'u'+Date.now(),title:d.get('title'),artist:d.get('artist')||'Unknown artist',src:URL.createObjectURL(file)});
    S.view='home';render()}
  else{const c={id:'c'+Date.now(),name:d.get('name'),ids,pub:!!d.get('pub')};
    lib[k==='playlist'?'playlists':'albums'].push(c);save('lib',lib);S.view='library';render()}
});

$('#pp').onclick=()=>{if(!au.src){playIds(tracks.map(t=>t.id),0);return}au.paused?au.play():au.pause()};
$('#pv').onclick=()=>step(-1);$('#nx').onclick=()=>step(1);
$('#vl').oninput=e=>au.volume=e.target.value;
$('#seek').oninput=e=>{if(au.duration)au.currentTime=au.duration*e.target.value/100};
au.onplay=au.onpause=bar;
au.ontimeupdate=()=>{$('#cur').textContent=fmt(au.currentTime);$('#dur').textContent=fmt(au.duration);$('#seek').value=au.duration?au.currentTime/au.duration*100:0};
au.onended=()=>{if(cfg.auto)step(1)};

applyAccent();render();
</script>
</body>
</html>
